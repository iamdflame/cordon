# One command from a clean checkout to a working system.
#
#   docker compose up
#
# Brings up HydraDB, ingests the sample graph, and serves the console at
# http://localhost:5173. A judge who hits a setup error stops judging, so this
# path is tested from a fresh clone rather than assumed to work.
#
# The full 226,357-edge HERB graph takes about an hour to ingest and is not what
# you want on a first run. `docker compose up` builds the sample: three
# overlapping product spaces, the whole pipeline, a few minutes. To reproduce
# the published numbers instead:
#
#   docker compose run --rm cordon npm run build:graph
#   docker compose run --rm cordon npm run audit

services:
  # Prepare the volume before the engine touches it.
  #
  # Three separate things break `docker compose up` on a clean checkout, and
  # each one hides the next:
  #
  #   1. the image runs as uid 10001, so a root-owned named volume is
  #      unwritable -> `Error: Os { code: 13, kind: PermissionDenied }`
  #   2. a host bind mount is unwritable too, unless the container uid happens
  #      to match whoever cloned the repo (scripts/hydra-up.sh passes
  #      `--user $(id -u):$(id -g)`; compose had no equivalent)
  #   3. the engine does not create its own store directory, so fixing the
  #      permissions only gets you `UnableToCanonicalize /data/store`
  #
  # This runs once, as root, and hands the volume over correctly owned. It is
  # eleven lines of YAML standing between a judge and a working console.
  hydra-init:
    image: busybox:1.36
    user: '0:0'
    command:
      - sh
      - -c
      - |
        mkdir -p /data/store /data/cache
        # The engine reads its token from a file and exits NotFound without one.
        printf '%s\n' "local-development-token-32-bytes" > /data/auth-token
        chown -R 10001:10001 /data
    volumes:
      - hydra-data:/data

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    depends_on:
      hydra-init:
        condition: service_completed_successfully
    container_name: cordon-hydradb
    ports:
      - '7687:7687'
      - '8443:8443'
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: 'true'
      RUST_MIN_STACK: '33554432'
    volumes:
      # A named volume, not a bind mount.
      #
      # `./.hydra-data:/data` fails on a clean checkout with
      # `Error: Os { code: 13, kind: PermissionDenied }` - the engine runs as a
      # uid that cannot write a host directory owned by whoever cloned the repo.
      # scripts/hydra-up.sh papers over it with `--user $(id -u):$(id -g)`,
      # which compose had no equivalent of, so `docker compose up` died on the
      # healthcheck for every user whose uid was not the image's.
      #
      # A named volume has no host-uid coupling at all, which is the difference
      # between "works on my machine" and a judge's first ninety seconds.
      - hydra-data:/data
    # No healthcheck here, deliberately.
    #
    # There used to be one, and it could never pass: it shelled out to `curl`,
    # which is not installed in this image. `docker compose up` therefore died
    # with "Container is unhealthy" on every machine, including ours - the
    # documented ninety-second path had never worked end to end.
    #
    # The wait now lives in scripts/compose-entrypoint.sh, in the service that
    # actually has the tools, rather than depending on what happens to be inside
    # an image we do not build.

  cordon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cordon
    depends_on:
      # Started, not healthy: readiness is the entrypoint's job now.
      - hydradb
    ports:
      - '8787:8787'
      - '5173:5173'
    environment:
      HYDRA_ENDPOINT: http://hydradb:8443
      HYDRA_TOKEN: local-development-token-32-bytes
      CORDON_GRAPH: cordon-sample
    volumes:
      - ./data:/app/data
    command: ['bash', 'scripts/compose-entrypoint.sh']

volumes:
  # Reset with `docker compose down -v`.
  hydra-data:
