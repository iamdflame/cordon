# One command from a clean checkout to a working system.
#
#   docker compose up
#
# Brings up HydraDB, ingests the sample graph, and serves the console at
# http://localhost:5173. A judge who hits a setup error stops judging, so this
# path is tested from a fresh clone rather than assumed to work.
#
# The full 226,357-edge HERB graph takes about an hour to ingest and is not what
# you want on a first run. `docker compose up` builds the sample: three
# overlapping product spaces, the whole pipeline, a few minutes. To reproduce
# the published numbers instead:
#
#   docker compose run --rm cordon npm run build:graph
#   docker compose run --rm cordon npm run audit

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: cordon-hydradb
    ports:
      - '7687:7687'
      - '8443:8443'
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: 'true'
      RUST_MIN_STACK: '33554432'
    volumes:
      - ./.hydra-data:/data
    healthcheck:
      # The engine rejects `MATCH (n)` with no label, so the probe names one.
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:8443/v1/graphs/default/query -H "Authorization: Bearer local-development-token-32-bytes" -H "X-Graph-Namespace: default" -H "Content-Type: application/json" --data ''{"cell_id":"cell-0","query":"MATCH (n:__probe) RETURN count(*)"}'' || exit 1',
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  cordon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cordon
    depends_on:
      hydradb:
        condition: service_healthy
    ports:
      - '8787:8787'
      - '5173:5173'
    environment:
      HYDRA_ENDPOINT: http://hydradb:8443
      HYDRA_TOKEN: local-development-token-32-bytes
      CORDON_GRAPH: cordon-sample
    volumes:
      - ./data:/app/data
    command: ['bash', 'scripts/compose-entrypoint.sh']
